<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>L'ANGELULUS</title>
<script>
/* SPA redirect cho GitHub Pages: chuyển /duong-dan-sau về /?/duong-dan-sau
   để index.html khôi phục lại URL sạch (giữ trạng thái 200, tốt cho SEO). */
(function(l){
  var pathSegmentsToKeep = 0;
  l.replace(
    l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
    l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
    l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
    (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
    l.hash
  );
}(window.location));
</script>
</head>
<body></body>
</html>
